<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/kangpos-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>KangPos</title>
    <style>
      html, body { margin: 0; padding: 0; min-height: 100vh; overflow: hidden; }
      #root { margin: 0; padding: 0; min-height: 100vh; width: 100%; height: 100%; }
      .app-loader {
        position: fixed; inset: 0; display: flex; flex-direction: column;
        align-items: center; justify-content: center; gap: 16px;
        background-color: #202020; color: rgba(255, 255, 255, 0.7);
        font-family: 'Segoe UI Variable Text', 'Segoe UI', system-ui, sans-serif;
        z-index: 10000; transition: opacity 300ms ease-out;
      }
      .app-loader.hidden { opacity: 0; pointer-events: none; }
      .app-loader-spinner {
        width: 32px; height: 32px; border-radius: 50%;
        border: 3px solid rgba(255, 255, 255, 0.1); border-top-color: #0078d4;
        animation: spin 0.8s linear infinite;
      }
      @keyframes spin { to { transform: rotate(360deg); } }
      .app-loader-text { font-size: 14px; opacity: 0.6; }
    </style>
  </head>
  <body>
    <div class="app-loader" id="html-loader">
      <div class="app-loader-spinner"></div>
      <div class="app-loader-text">Loading...</div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
